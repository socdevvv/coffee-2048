<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 — кофейная передышка</title>
<meta name="description" content="2048 с кофейным настроением: стрелки или свайпы, рекорд сохраняется.">
<meta name="theme-color" content="#140c08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2324150F'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='24' font-weight='bold' fill='%23D96B27' text-anchor='middle'%3E2048%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #140c08;
    --surface: #24150f;
    --line: #3a2418;
    --text: #f6ede5;
    --muted: #a58b7a;
    --accent: #d96b27;
    --accent-soft: #f0a05e;
    --board: #2a1810;
    --cell: #1d110b;
    --gap: clamp(8px, 2.2vw, 11px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(900px 480px at 85% -10%, rgba(217, 107, 39, .10), transparent 60%),
      var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  .app { width: min(480px, 100%); }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: clamp(30px, 8vw, 38px); letter-spacing: -1px; line-height: 1; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .scores { display: flex; gap: 8px; }
  .score {
    min-width: 76px;
    padding: 8px 10px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  .score span {
    display: block;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .score strong {
    display: inline-block;
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  .score.bump strong { animation: bump .18s ease; }
  @keyframes bump {
    50% { transform: scale(1.18); color: var(--accent-soft); }
  }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 10px; }
  button {
    border: 0;
    border-radius: 12px;
    padding: 10px 14px;
    background: var(--accent);
    color: #1d0f07;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  button:active { transform: scale(.97); }
  .hint { color: var(--muted); font-size: 12px; }
  .board {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--board);
    container-type: inline-size;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
  }
  .cells, .tiles { position: absolute; inset: var(--gap); }
  .cells {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }
  .cells div { background: var(--cell); border-radius: 10px; }
  .tile {
    position: absolute;
    width: calc((100% - 3 * var(--gap)) / 4);
    height: calc((100% - 3 * var(--gap)) / 4);
    left: calc((100% - 3 * var(--gap)) / 4 * var(--c) + var(--gap) * var(--c));
    top: calc((100% - 3 * var(--gap)) / 4 * var(--r) + var(--gap) * var(--r));
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    letter-spacing: -1px;
    font-size: clamp(20px, 8.6cqw, 44px);
    transition: left .12s ease, top .12s ease, background-color .12s ease, color .12s ease;
  }
  .tile[data-len="3"] { font-size: clamp(18px, 7.2cqw, 36px); }
  .tile[data-len="4"] { font-size: clamp(16px, 6.1cqw, 31px); }
  .tile[data-v="2"] { background: #f6ede5; color: #3a2418; }
  .tile[data-v="4"] { background: #efd9c2; color: #3a2418; }
  .tile[data-v="8"] { background: #f0a05e; color: #2a160c; }
  .tile[data-v="16"] { background: #e98b3f; color: #2a160c; }
  .tile[data-v="32"] { background: #d96b27; color: #1d0f07; }
  .tile[data-v="64"] { background: #b6521c; color: #fff3e8; }
  .tile[data-v="128"] { background: #96411a; color: #fff3e8; }
  .tile[data-v="256"] { background: #76320f; color: #fff3e8; }
  .tile[data-v="512"] { background: #54230a; color: #fff3e8; }
  .tile[data-v="1024"] { background: #341506; color: var(--accent-soft); }
  .tile[data-v="2048"] { background: linear-gradient(135deg, #f0a05e, #d96b27); color: #1d0f07; box-shadow: 0 0 24px rgba(240, 160, 94, .45); }
  .tile[data-v="4096"] { background: #1f0e06; color: var(--accent-soft); }
  .tile.appear { animation: tileIn .14s ease; }
  @keyframes tileIn {
    from { transform: scale(.55); opacity: .3; }
    to { transform: scale(1); opacity: 1; }
  }
  .tile.pop { animation: pop .16s ease; }
  @keyframes pop {
    50% { transform: scale(1.09); }
  }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 22px;
    border-radius: 18px;
    background: rgba(20, 12, 8, .88);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay .big { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .overlay .small { color: var(--muted); font-size: 14px; }
  .over-actions { display: flex; gap: 8px; margin-top: 12px; }
  footer { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 14px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--accent-soft); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>2048</h1>
      <p class="sub">Кофейная передышка</p>
    </div>
    <div class="scores">
      <div class="score" id="scoreBox"><span>Очки</span><strong id="score">0</strong></div>
      <div class="score" id="bestBox"><span>Рекорд</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="bar">
    <button id="new" type="button">Новая игра</button>
    <span class="hint">Стрелки или свайпы</span>
  </div>

  <div class="board" id="board" tabindex="0" aria-label="Игровое поле 2048">
    <div class="cells" aria-hidden="true">
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay" hidden>
      <p class="big" id="overTitle"></p>
      <p class="small" id="overSub"></p>
      <div class="over-actions">
        <button id="continue" type="button" hidden>Продолжить</button>
        <button id="restart" type="button">Новая игра</button>
      </div>
    </div>
  </div>

  <footer>
    <span>Сделано по приколу. Рекорд хранится на телефоне.</span>
    <a href="https://arctikasdiary-creator.github.io/coffee-roulette/">Кофейная рулетка</a>
  </footer>
</div>

<script>
const SIZE = 4;
const BEST_KEY = "coffee2048.best";
const els = {
  board: document.getElementById("board"),
  tiles: document.getElementById("tiles"),
  score: document.getElementById("score"),
  best: document.getElementById("best"),
  scoreBox: document.getElementById("scoreBox"),
  bestBox: document.getElementById("bestBox"),
  overlay: document.getElementById("overlay"),
  overTitle: document.getElementById("overTitle"),
  overSub: document.getElementById("overSub"),
  continueBtn: document.getElementById("continue"),
  restart: document.getElementById("restart"),
  newGame: document.getElementById("new"),
};

let grid;
let score = 0;
let best = Number(localStorage.getItem(BEST_KEY) || 0);
let won = false;
let over = false;
let paused = false;
let seq = 0;
const tileEls = new Map();

function nid() {
  seq += 1;
  return "t" + seq;
}

function emptyGrid() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
}

function allTiles() {
  return grid.flat().filter(Boolean);
}

function updateScore(bump) {
  els.score.textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem(BEST_KEY, String(best));
  }
  els.best.textContent = best;
  if (bump) {
    els.scoreBox.classList.remove("bump");
    void els.scoreBox.offsetWidth;
    els.scoreBox.classList.add("bump");
  }
}

function clearTiles() {
  tileEls.forEach((el) => el.remove());
  tileEls.clear();
}

function render(mergedIds) {
  const seen = new Set();
  for (const t of allTiles()) {
    seen.add(t.id);
    let el = tileEls.get(t.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "tile appear";
      el.style.setProperty("--r", t.r);
      el.style.setProperty("--c", t.c);
      el.textContent = t.value;
      el.dataset.v = t.value;
      el.dataset.len = String(t.value).length;
      tileEls.set(t.id, el);
      els.tiles.appendChild(el);
      continue;
    }
    el.textContent = t.value;
    el.dataset.v = t.value;
    el.dataset.len = String(t.value).length;
    el.style.setProperty("--r", t.r);
    el.style.setProperty("--c", t.c);
  }
  for (const [id, el] of tileEls) {
    if (!seen.has(id)) {
      el.remove();
      tileEls.delete(id);
    }
  }
  if (mergedIds) {
    for (const id of mergedIds) {
      const el = tileEls.get(id);
      if (!el) continue;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
    }
  }
}

function spawn() {
  const free = [];
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      if (!grid[r][c]) free.push([r, c]);
    }
  }
  if (!free.length) return;
  const [r, c] = free[Math.floor(Math.random() * free.length)];
  grid[r][c] = { id: nid(), value: Math.random() < 0.9 ? 2 : 4, r, c };
}

function canMove() {
  if (allTiles().length < SIZE * SIZE) return true;
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const v = grid[r][c].value;
      if (c + 1 < SIZE && grid[r][c + 1].value === v) return true;
      if (r + 1 < SIZE && grid[r + 1][c].value === v) return true;
    }
  }
  return false;
}

function showOverlay(title, sub, canContinue) {
  paused = true;
  els.overTitle.textContent = title;
  els.overSub.textContent = sub;
  els.continueBtn.hidden = !canContinue;
  els.overlay.hidden = false;
}

function hideOverlay() {
  paused = false;
  els.overlay.hidden = true;
}

function checkState() {
  if (!won && allTiles().some((t) => t.value >= 2048)) {
    won = true;
    showOverlay("2048!", "Ты собрал плитку. Счёт: " + score, true);
    return;
  }
  if (!canMove()) {
    over = true;
    showOverlay("Игра окончена", "Счёт: " + score, false);
  }
}

function reset() {
  grid = emptyGrid();
  score = 0;
  won = false;
  over = false;
  paused = false;
  clearTiles();
  els.overlay.hidden = true;
  spawn();
  spawn();
  render();
  updateScore(false);
}

function move(dir) {
  if (paused || over) return;
  const lines = [];
  if (dir === "left" || dir === "right") {
    for (let r = 0; r < SIZE; r += 1) {
      const cols = [0, 1, 2, 3];
      if (dir === "right") cols.reverse();
      lines.push(cols.map((c) => [r, c]));
    }
  } else {
    for (let c = 0; c < SIZE; c += 1) {
      const rows = [0, 1, 2, 3];
      if (dir === "down") rows.reverse();
      lines.push(rows.map((r) => [r, c]));
    }
  }

  const oldPos = new Map();
  for (const t of allTiles()) oldPos.set(t.id, [t.r, t.c]);

  const next = emptyGrid();
  const mergedIds = [];
  let gained = 0;
  let merges = 0;

  for (const positions of lines) {
    const line = positions.map(([r, c]) => grid[r][c]).filter(Boolean);
    const out = [];
    for (let i = 0; i < line.length; i += 1) {
      const t = line[i];
      if (i + 1 < line.length && line[i + 1].value === t.value) {
        out.push({ id: t.id, value: t.value * 2, merged: true });
        gained += t.value * 2;
        merges += 1;
        mergedIds.push(t.id);
        i += 1;
      } else {
        out.push({ id: t.id, value: t.value, merged: false });
      }
    }
    out.forEach((t, k) => {
      const [r, c] = positions[k];
      next[r][c] = { id: t.id, value: t.value, r, c };
    });
  }

  let moved = merges > 0;
  for (const t of next.flat().filter(Boolean)) {
    const old = oldPos.get(t.id);
    if (!old || old[0] !== t.r || old[1] !== t.c) {
      moved = true;
      break;
    }
  }
  if (!moved) return;

  grid = next;
  score += gained;
  spawn();
  render(mergedIds);
  updateScore(gained > 0);
  checkState();
}

const KEYS = {
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  a: "left", d: "right", w: "up", s: "down",
  "ф": "left", "в": "right", "ц": "up", "ы": "down",
};

window.addEventListener("keydown", (event) => {
  const dir = KEYS[event.key] || KEYS[event.key.toLowerCase()];
  if (!dir) return;
  event.preventDefault();
  move(dir);
});

let pointerStart = null;
els.board.addEventListener("pointerdown", (event) => {
  pointerStart = { x: event.clientX, y: event.clientY };
});
els.board.addEventListener("pointercancel", () => {
  pointerStart = null;
});
els.board.addEventListener("pointerup", (event) => {
  if (!pointerStart) return;
  const dx = event.clientX - pointerStart.x;
  const dy = event.clientY - pointerStart.y;
  pointerStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
  else move(dy > 0 ? "down" : "up");
});

els.newGame.addEventListener("click", reset);
els.restart.addEventListener("click", reset);
els.continueBtn.addEventListener("click", hideOverlay);

const params = new URLSearchParams(location.search);
if (params.has("debug")) {
  window.__t2048 = {
    grid: () => grid.map((row) => row.map((t) => (t ? t.value : 0))),
    score: () => score,
    over: () => over,
    paused: () => paused,
    move,
    spawn,
    tick: checkState,
    setGrid(values) {
      grid = values.map((row, r) =>
        row.map((v, c) => (v ? { id: nid(), value: v, r, c } : null))
      );
      score = 0;
      won = false;
      over = false;
      paused = false;
      els.overlay.hidden = true;
      clearTiles();
      render();
      updateScore(false);
    },
  };
}

reset();
</script>
</body>
</html>
